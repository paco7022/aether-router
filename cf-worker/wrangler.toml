name = "aether-router-edge"
main = "src/worker.js"
compatibility_date = "2026-05-01"
workers_dev = false

[vars]
# PC decommissioned (2026-05-31): route all traffic straight to cloud so the
# powered-off home PC isn't probed. Flip back to "true" to re-enable PC-first.
PC_ENABLED = "false"
PC_ORIGIN = "https://router.aether-ai.dev"
CLOUD_ORIGIN = "https://router-cloud.aether-ai.dev"
PC_ACTIVE_START_HOUR = "7"
PC_ACTIVE_END_HOUR = "22"
ROUTING_TIMEZONE_OFFSET_MINUTES = "-360"

# Bind the worker to api.aether-ai.dev (entire hostname).
# The zone must exist in Cloudflare with the matching account.
[[routes]]
pattern = "api.aether-ai.dev/*"
zone_name = "aether-ai.dev"
